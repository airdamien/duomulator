  Duomulator:
    type: application
    platform: iOS
    dependencies:
      - target: SNESCore
      - target: NESCore
      - target: DSCore
      - target: SegaCore
      - target: ArcadeCore
      - target: PSXCore
      - target: N64Core
      - sdk: OpenGLES.framework
      - sdk: AudioToolbox.framework
      # Mupen64Plus' bundled zlib breaks on Apple platforms (zutil.h defines fdopen as NULL);
      # the system zlib is ABI-compatible.
      - sdk: libz.tbd
    sources:
      - path: App
      - path: Core
      # Public-domain demo games (see App/Library/DemoGames.swift).
      - path: tools/showcase
        includes: ["*.sfc", "*.nds", "*.md"]
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.kurast.duomulator
        SWIFT_OBJC_BRIDGING_HEADER: Core/Duomulator-Bridging-Header.h
        HEADER_SEARCH_PATHS: "$(SRCROOT)/Vendor/snes9x/libretro"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Duomulator
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "9"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortraitUpsideDown"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.games
        # HTTPS (box art) and the DS core's DSi title decryption only: exempt from export filings.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        TARGETED_DEVICE_FAMILY: "1"
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
        SWIFT_STRICT_CONCURRENCY: minimal
      configs:
        # Release is what goes to the App Store: no box art downloads (see ArtworkSettings).
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) APP_STORE"
  DuomulatorTests:
    type: bundle.unit-test
    platform: iOS
    dependencies:
      - target: Duomulator
    sources:
      - path: Tests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        HEADER_SEARCH_PATHS: "$(SRCROOT)/Vendor/snes9x/libretro"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Duomulator.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Duomulator"
schemes:
  Duomulator:
    build:
      targets:
        Duomulator: all
        DuomulatorTests: [test]
    test:
      targets:
        - DuomulatorTests
